<div class="login-container">
  <div class="login-card animate-fade-in">

    <h1 class="title-xl">Login</h1>
    <p class="login-subtitle">
      Entre para avaliar eventos e estandes
    </p>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          email
          #emailField="ngModel"
          placeholder="Digite seu email"
          [class.input-error]="emailField.invalid && emailField.touched"
        />
        <span class="error-msg" *ngIf="emailField.invalid && emailField.touched">
          <span *ngIf="emailField.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="emailField.errors?.['email'] && !emailField.errors?.['required']">Email inválido</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          #passwordField="ngModel"
          placeholder="Digite sua senha"
          [class.input-error]="passwordField.invalid && passwordField.touched"
        />
        <span class="error-msg" *ngIf="passwordField.invalid && passwordField.touched">
          <span *ngIf="passwordField.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="passwordField.errors?.['minlength']">Mínimo de 6 caracteres</span>
        </span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Entrar →</span>
        <span *ngIf="loading">Entrando...</span>
      </button>

    </form>

    <p class="error-server" *ngIf="errorMessage">{{ errorMessage }}</p>

  </div>
</div>
