<div class="edit-container animate-fade-in">
    <div class="top-bar">
        <a [routerLink]="['/evento', eventId]" class="back-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" />
            </svg>
            Voltar para o evento
        </a>
    </div>

    <div class="content-layout">
        <div class="form-wrapper" *ngIf="!isLoading">
            <h1 class="page-title">Editar Evento</h1>
            <p class="page-subtitle">Atualize as informações do seu evento para os participantes.</p>

            <form [formGroup]="eventForm" (ngSubmit)="saveChanges()" class="edit-form">
                <div class="form-group">
                    <label for="title">Título do Evento</label>
                    <input type="text" id="title" formControlName="title" required class="form-input" [class.error]="isSubmitted && eventForm.get('title')?.invalid">
                </div>

                <div class="form-group">
                    <label for="date">Data de Realização</label>
                    <input type="date" id="date" formControlName="date" required class="form-input" [class.error]="isSubmitted && eventForm.get('date')?.invalid">
                </div>

                <div class="form-group">
                    <label for="local">Local de Evento</label>
                    <input type="text" id="local" formControlName="local" required class="form-input" [class.error]="isSubmitted && eventForm.get('local')?.invalid">
                </div>

                <div class="form-group">
                    <label for="description">Descrição Oficial</label>
                    <textarea id="description" formControlName="description" rows="5" required class="form-input" [class.error]="isSubmitted && eventForm.get('description')?.invalid"></textarea>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="save-btn" [disabled]="!eventForm.valid">
                        Salvar Alterações
                    </button>
                </div>
            </form>

            <div class="success-message animate-fade-in" *ngIf="isSuccess">
                Alterações salvas com sucesso! Redirecionando... 🏅
            </div>
        </div>

        <div class="loading-wrapper" *ngIf="isLoading">
            <p>Carregando informações do evento...</p>
        </div>
    </div>
</div>
