<div class="page-container animate-fade-in">
  <div class="header-section">
    <h1 class="title-lg">Criar <span class="text-gradient-orange">Evento</span></h1>
    <p>Organize novos eventos universitários. Embora nosso foco de demonstração seja o Inovaweek, a plataforma Notalise suporta infinitos eventos.</p>
  </div>

  <div class="form-card glass-panel orange-accent">
    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="stand-form">
      
      <div class="form-group-row">
        <div class="form-group">
          <label class="form-label">Título do Evento</label>
          <input type="text" formControlName="title" class="form-input" placeholder="Ex: Inovaweek 2026" [class.error]="isSubmitted && eventForm.get('title')?.invalid"/>
        </div>
        
        <div class="form-group">
          <label class="form-label">Data de Realização</label>
          <input type="date" formControlName="date" class="form-input" [class.error]="isSubmitted && eventForm.get('date')?.invalid"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Local de Evento</label>
        <input type="text" formControlName="local" class="form-input" placeholder="Ex: Campus Boa Vista UVV" [class.error]="isSubmitted && eventForm.get('local')?.invalid"/>
      </div>

      <div class="form-group">
        <label class="form-label">Descrição Oficial</label>
        <textarea formControlName="description" class="form-input" placeholder="Objetivo do evento e critérios de avaliação..." [class.error]="isSubmitted && eventForm.get('description')?.invalid"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary orange-btn w-full pulse-btn">
          Cadastrar Novo Evento
        </button>
      </div>
      
      <div class="success-message" *ngIf="isSuccess">
        Evento registrado! Vá para Estandes ou Comentários para explorá-lo. 🏅
      </div>

    </form>
  </div>
</div>
