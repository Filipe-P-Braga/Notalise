<nav class="navbar glass-panel">
  <div class="nav-container">
    <div class="nav-logo">
      <a routerLink="/" class="nav-logo-link">
        <span class="text-gradient">Notalise</span>
      </a>
    </div>
    
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">Início</a>
      <!-- <a routerLink="/estande" routerLinkActive="active" class="nav-item">Estandes</a> -->
      <a routerLink="/eventos" routerLinkActive="active" class="nav-item">Eventos</a>
      <!-- <a routerLink="/comentarios" routerLinkActive="active" class="nav-item">Comentários</a> -->
      
      @if (authService.isLoggedIn()) {
        <span class="nav-user-email">{{ authService.getUser()?.email }}</span>
        <span class="nav-role-badge role-{{ authService.getRole() }}">{{ authService.getRole() }}</span>
        <button class="nav-logout-btn" (click)="authService.logout()">Sair</button>
      } @else {
        <a routerLink="/login" class="nav-user-btn" title="Entrar">
          <img src="/IconBranco.png" alt="Entrar" class="nav-item-image">
        </a>
      }
    </div>
  </div>
</nav>
