<div class="qrcode-wrapper">
  <button (click)="gerarQRCode()" class="btn-primary orange-btn w-full pulse-btn">Gerar QR Code</button>
</div>

<!-- Overlay -->
<div class="overlay" *ngIf="isOpen" (click)="fechar()">

  <!-- Modal -->
  <div class="modal" (click)="$event.stopPropagation()">
    <img [src]="qrCodeImage" />
  </div>

</div>
